name: Daily Ohtani HR Data Sync & Deploy

on:
  schedule:
    - cron: '0 5 * * *' # Automatically runs every day at 13:00 TST (05:00 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync Ohtani HR Data & Rebuild HTML
        run: |
          python cron_update.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html ohtani_hrs_mlb.json ohtani_hrs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: daily sync Ohtani HR data and rebuild dashboard [skip ci]" && git push)
